name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q -o '*.zip'

      - name: Show files
        run: find . -not -path './.git/*' | head -60

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: |
          ROOT=$(dirname "$(find . -name settings.gradle.kts -not -path './.git/*' | head -n 1)")
          echo "Project root: $ROOT"
          cd "$ROOT"
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: PhoneBooster-APK
          path: "**/build/outputs/apk/debug/*.apk"
